<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆袭看板 · Rise</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #d4af37;
    --gold-light: #f5e6a8;
    --gold-dim: #8a6d1f;
    --bg: #0a0a0c;
    --muted: #9a917d;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: #ece7d8;
    overflow-x: hidden;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .hero .bg {
    position: absolute; inset: 0;
    background: url("assets/dy-note2.webp") center/cover no-repeat;
    transform: scale(1.04);
    animation: heroZoom 24s ease-in-out infinite alternate;
  }
  @keyframes heroZoom {
    from { transform: scale(1.04) translate(0,0); }
    to   { transform: scale(1.12) translate(-1.5%, -1%); }
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, var(--bg) 4%, rgba(10,10,12,.55) 42%, rgba(10,10,12,.35) 75%),
      linear-gradient(to right, rgba(10,10,12,.5), transparent 60%);
  }
  .hero-inner {
    position: relative; z-index: 2;
    padding: 0 6vw 9vh;
    max-width: 900px;
  }
  .hero .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .5em;
    color: var(--gold);
    border: 1px solid rgba(212,175,55,.45);
    padding: 7px 20px 7px 25px;
    border-radius: 999px;
    margin-bottom: 24px;
    background: rgba(0,0,0,.3);
    backdrop-filter: blur(6px);
  }
  .hero h1 {
    font-size: clamp(38px, 7vw, 84px);
    font-weight: 800;
    letter-spacing: .08em;
    line-height: 1.15;
    text-shadow: 0 4px 30px rgba(0,0,0,.6);
  }
  .hero h1 em {
    font-style: normal;
    background: linear-gradient(120deg, var(--gold-dim), var(--gold-light));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    margin-top: 20px;
    font-size: clamp(14px, 1.8vw, 17px);
    color: #cfc8b4;
    letter-spacing: .1em;
    line-height: 1.9;
    max-width: 560px;
  }
  .scroll-hint {
    position: absolute;
    bottom: 26px; right: 5vw;
    z-index: 2;
    color: var(--gold-dim);
    font-size: 12px;
    letter-spacing: .3em;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }

  /* ---------- FUEL ---------- */
  .fuel {
    max-width: 460px;
    margin: 0 auto;
    padding: 110px 24px 40px;
    text-align: center;
  }
  .fuel .frame {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,.2);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    aspect-ratio: 1320 / 1739;
    max-height: 72vh;
    margin: 0 auto;
  }
  .fuel .frame img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(.95) brightness(.92);
    transition: transform .9s cubic-bezier(.2,.8,.2,1), filter .4s;
  }
  .fuel .frame:hover img { transform: scale(1.04); filter: saturate(1.05) brightness(1); }
  .fuel .cap { margin-top: 26px; }
  .fuel .cap .num {
    font-size: 15px; font-weight: 600;
    letter-spacing: .15em; color: var(--gold-light);
  }
  .fuel .cap .sub { font-size: 12.5px; color: var(--muted); margin-top: 6px; letter-spacing: .08em; }

  /* ---------- MANTRA ---------- */
  .mantra {
    text-align: center;
    padding: 90px 24px 130px;
    position: relative;
  }
  .mantra h2 {
    font-size: clamp(32px, 6.5vw, 68px);
    font-weight: 700;
    letter-spacing: .16em;
    background: linear-gradient(120deg, #8a6d1f 0%, var(--gold) 35%, var(--gold-light) 50%, var(--gold) 65%, #8a6d1f 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .mantra p { margin-top: 18px; color: var(--muted); font-size: 14px; letter-spacing: .3em; }

  footer {
    text-align: center;
    padding: 0 24px 44px;
    color: var(--gold-dim);
    font-size: 12px;
    letter-spacing: .25em;
  }
</style>
</head>
<body>

<!-- ============ HERO ============ -->
<div class="hero">
  <div class="bg"></div>
  <div class="hero-inner">
    <div class="tag">RISE · 逆 袭</div>
    <h1>别让未来的你，<br><em>等太久</em></h1>
    <p>睡醒肌肉维度大一圈，体脂低一度。改变不是一夜之间发生的，是你每天选择的总和。</p>
  </div>
  <div class="scroll-hint">向 下 滚 动</div>
</div>

<!-- ============ FUEL ============ -->
<div class="fuel">
  <div class="frame">
    <img src="assets/dy-note1.webp" alt="Who are you??" loading="lazy">
  </div>
  <div class="cap">
    <div class="num">WHO ARE YOU？？</div>
    <div class="sub">#健身 #改变自己 #自律 —— 你是谁，由你每天的选择决定</div>
  </div>
</div>

<!-- ============ MANTRA ============ -->
<div class="mantra">
  <h2>逆 袭 之 路</h2>
  <p>不 需 要 一 夜 暴 富 ， 只 要 每 天 都 比 昨 天 多 走 一 步</p>
</div>

<footer>DESIGNED FOR THE ONES WHO REFUSE TO STAY DOWN</footer>

</body>
</html>
